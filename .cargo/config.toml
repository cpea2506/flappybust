[alias]
watch_dynamic = ["watch", "-i", "assets", "-c", "-x", "run --features bevy/dynamic_linking"]
run_wasm = "run --target wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
runner = "wasm-server-runner"

# Enable max optimizations for dependencies, but not for our code:
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = false
